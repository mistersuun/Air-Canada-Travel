name: Update Flight Schedules

on:
  schedule:
    # Every Monday at 6am UTC (AC typically updates schedules on weekends)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Manual trigger from the GitHub Actions UI
    inputs:
      allow_route_drop:
        description: 'Accept a route/record count below 80% of the committed file (a real seasonal cut)'
        type: boolean
        default: false

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scraper unit tests
        run: python -m pytest -q scripts/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch latest schedules
        # Exits non-zero (and leaves schedules.json untouched) if any safety gate fails.
        # Leaves the file untouched too when only generatedAt would change.
        env:
          ALLOW_ROUTE_DROP: ${{ inputs.allow_route_drop && '--allow-route-drop' || '' }}
        run: python3 scripts/fetch-schedules.py $ALLOW_ROUTE_DROP

      - name: Fetch route network (Wikipedia + OurAirports, no times)
        # Which Air Canada / Express / Rouge routes are flown from the hubs, for
        # routes the Vacations PDFs leave out. Same gates and no-op rule as the
        # schedules step; --allow-route-drop applies to both.
        env:
          ALLOW_ROUTE_DROP: ${{ inputs.allow_route_drop && '--allow-route-drop' || '' }}
        run: python3 scripts/fetch-route-network.py $ALLOW_ROUTE_DROP

      - name: Diff summary
        run: |
          {
            echo '### Data diff'
            echo '```'
            git diff --stat -- public/data/schedules.json public/data/route-network.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: App tests (no coverage gate)
        run: npx vitest run

      - name: Production build
        run: npx ng build

      - name: Commit and push if changed
        run: |
          git diff --quiet -- public/data/schedules.json public/data/route-network.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/schedules.json public/data/route-network.json
          git commit -m "chore: update flight schedules and route network"
          git push

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Schedule update failed ($(date -u +%Y-%m-%d))" \
            --body "The update-schedules workflow failed and nothing was committed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

name: Update Flight Schedules

on:
  schedule:
    # Run every Monday at 6am UTC (AC typically updates schedules on weekends)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pdfplumber

      - name: Fetch latest schedules
        run: python3 scripts/fetch-schedules.py

      - name: Commit and push if changed
        run: |
          git diff --quiet src/app/data/schedules.ts && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/data/schedules.ts
          git commit -m "chore: update flight schedules from AC Vacations PDFs"
          git push

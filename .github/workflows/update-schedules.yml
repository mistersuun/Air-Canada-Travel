name: Update Flight Schedules

on:
  schedule:
    # Every Monday at 6am UTC (AC typically updates schedules on weekends)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Manual trigger from the GitHub Actions UI
    inputs:
      allow_route_drop:
        description: 'Accept a route/record count below 80% of the committed file (a real seasonal cut)'
        type: boolean
        default: false
      allow_short_coverage:
        description: 'Accept schedules that end less than 28 days ahead (14 for a required hub)'
        type: boolean
        default: false

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          # npm ci install scripts must not be able to read the write token.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scraper unit tests
        run: python -m pytest -q scripts/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch latest schedules
        # Exits non-zero (and leaves schedules.json untouched) if any safety gate fails.
        # Leaves the file untouched too when only generatedAt would change.
        env:
          ALLOW_ROUTE_DROP: ${{ inputs.allow_route_drop && '--allow-route-drop' || '' }}
          ALLOW_SHORT_COVERAGE: ${{ inputs.allow_short_coverage && '--allow-short-coverage' || '' }}
        run: python3 scripts/fetch-schedules.py $ALLOW_ROUTE_DROP $ALLOW_SHORT_COVERAGE

      - name: Fetch route network (Wikipedia + OurAirports, no times)
        id: route_network
        # A failure here must not discard the schedules update: it is reported after the commit.
        continue-on-error: true
        # Which Air Canada / Express / Rouge routes are flown from the hubs, for
        # routes the Vacations PDFs leave out. Same gates and no-op rule as the
        # schedules step; --allow-route-drop applies to both.
        env:
          ALLOW_ROUTE_DROP: ${{ inputs.allow_route_drop && '--allow-route-drop' || '' }}
        run: python3 scripts/fetch-route-network.py $ALLOW_ROUTE_DROP

      - name: Discard a failed route network update
        if: steps.route_network.outcome == 'failure'
        run: git checkout -- public/data/route-network.json

      - name: Diff summary
        run: |
          {
            echo '### Data diff'
            echo '```'
            git diff --stat -- public/data/schedules.json public/data/schedules-meta.json public/data/route-network.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: App tests (no coverage gate)
        # data-health.spec.ts checks the committed data's age: this job is what refreshes it.
        run: npx vitest run --exclude '**/data-health.spec.ts'

      - name: Production build
        run: npx ng build

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- public/data/schedules.json public/data/schedules-meta.json public/data/route-network.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/schedules.json public/data/schedules-meta.json public/data/route-network.json
          git commit -m "chore: update flight schedules and route network"
          # Other data workflows push to the same branch: rebase onto it and retry.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase "$remote" "${GITHUB_REF_NAME}" && git push "$remote" "HEAD:${GITHUB_REF}" && exit 0
            echo "push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Fail if the route network step failed
        # After the commit, so schedules.json is kept; makes the job red and opens the issue below.
        if: steps.route_network.outcome == 'failure'
        run: |
          echo "::error::fetch-route-network failed; schedules.json was committed without a route network update"
          exit 1

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Schedule update failed ($(date -u +%Y-%m-%d))" \
            --body "The update-schedules workflow failed (if only the route network step failed, schedules.json was still committed). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

[build]
  command = "npm ci && npm run build"
  publish = "dist/ac-explorer/browser"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Boarding passes, booking codes and files live on this device: keep
    # scripts to this origin. The two hashes are the pre-paint theme script in
    # src/index.html and Angular's critical-CSS onload="this.media='all'"
    # (csp.spec.ts fails if either changes). 'wasm-unsafe-eval' is for the
    # zxing barcode reader; worker-src covers the service worker, pdf.js and
    # the barcode decode worker (a same-origin worker-<hash>.js).
    # connect-src lists the font hosts because the service worker fetches them,
    # and api.open-meteo.com for the weather forecast (destination coordinates only).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-hashes' 'sha256-RRtvQ/ngPYYKxMKmwEGOBCInozN2Nad/RW3leEYlGYY=' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://api.open-meteo.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Files that must always revalidate so a new deploy (and new schedules) is picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# Our service worker wrapper (importScripts of ngsw-worker.js, share target).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Schedule data is not content-hashed: always revalidate (the service worker
# versions it through ngsw.json).
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Destination photos: file names are stable, so cache for a week and let the
# service worker (dest-photos group) revalidate in the background. credits.json
# shares this lifetime and PhotoService fetches it through the normal HTTP
# cache, so the credit shown always ages with the photo it describes.
[[headers]]
  for = "/img/dest/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# On-device barcode decoding and PDF reading (boarding passes). With nosniff,
# a wrong type stops the wasm or the pdf.js worker from loading, so set them.
[[headers]]
  for = "/vendor/zxing/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/vendor/pdfjs/*.mjs"
  [headers.values]
    Content-Type = "text/javascript"

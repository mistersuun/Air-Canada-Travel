<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Routes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#CFE6FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F2238" media="(prefers-color-scheme: dark)">
  <script>
    // Pre-paint theme: avoid a flash of the wrong theme. The single source of
    // truth is localStorage['ac.prefs.v1'] (JSON) field `theme`:
    // 'light' | 'dark' | 'auto' (auto = no data-theme attribute).
    (function () {
      try {
        var raw = localStorage.getItem('ac.prefs.v1');
        var theme = raw ? JSON.parse(raw).theme : null;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', theme === 'dark' ? '#0F2238' : '#CFE6FF');
          }
        }
      } catch (e) { /* storage blocked or malformed: follow the OS */ }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AC Trips">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
